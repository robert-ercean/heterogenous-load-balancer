global
    maxconn 30000
    nbthread 4

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend my_frontend
    bind *:5555
    default_backend my_backends

backend my_backends
    balance random

    server backend1 172.31.32.252:50051 check
    server backend2 172.31.34.16:50051 check
    server backend3 172.31.34.3:50051 check
    server backend4 172.31.34.89:50051 check
    server backend5 172.31.35.172:50051 check
    server backend6 172.31.36.67:50051 check
    server backend7 172.31.39.79:50051 check
    server backend8 172.31.40.35:50051 check
    server backend9 172.31.40.99:50051 check
    server backend10 172.31.42.20:50051 check
    server backend11 172.31.43.7:50051 check
