user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 100000;
    multi_accept on;
    use epoll;
}

stream {
    upstream my_backends {
        # P2C with least_conn load calculation
        random two least_conn;

        server 172.31.32.252:50051;
        server 172.31.34.16:50051;
        server 172.31.34.3:50051;
        server 172.31.34.89:50051;
        server 172.31.35.172:50051;
        server 172.31.36.67:50051;
        server 172.31.39.79:50051;
        server 172.31.40.35:50051;
        server 172.31.40.99:50051;
        server 172.31.42.20:50051;
        server 172.31.43.7:50051;
        server 172.31.44.117:50051;
        server 172.31.44.2:50051;
        server 172.31.46.222:50051;
        server 172.31.46.231:50051;
        server 172.31.47.99:50051;
    }

    server {
        listen 5555;
        proxy_pass my_backends;
        proxy_connect_timeout 5s;
    }
}
